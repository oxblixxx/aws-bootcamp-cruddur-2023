---
AWSTemplateFormatVersion: 2010-09-09

Description:
  This is the VPC for CRUDDUR APP, WHICH CONISTS OF 2 PUBLIC SUBNETS, 2 PRIVATE SUBNETS, 1 INTERNET GATEWAY, 1 NAT GATEWAY, 1 ROUTE TABLE FOR PUBLIC SUBNETS AND 1 ROUTE TABLE FOR PRIVATE SUBNETS.

Parameters: 
  AvailabilityZones:
    Type: CommaDelimitedList
    Description: Availability Zones to use
    Default: us-east-1a,us-east-1b,us-east-1c,us-east-1d,us-east-1e,us-east-1f

  AcmCertificateArn:
    Type: String
    Description: Availability Zones to use
    Default: arn:aws:acm:us-east-1:193654356005:certificate/edb389be-6bbd-4536-bc22-d4f17109a160


Resources:
# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-vpc.html
  CruddurVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.10.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: cruddur-vpc
        - Key: Environment
          Value: production

  Crudduripv6CidrBlock:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref CruddurVPC
      AmazonProvidedIpv6CidrBlock: true

 # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-internetgateway.html 
  CruddurInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
      - Key: Name
        Value: cruddur-igw
      - Key: Environment
        Value: production

# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-vpcgatewayattachment.html
  CruddurVPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref CruddurVPC
      InternetGatewayId: !Ref CruddurInternetGateway

# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-subnet.html
  CruddurPublicSubnet1:
    Type: AWS::EC2::Subnet
    DependsOn: Crudduripv6CidrBlock
    Properties:
      VpcId: !Ref CruddurVPC
      CidrBlock: 10.10.0.0/20
      AssignIpv6AddressOnCreation: true
      Ipv6CidrBlock: !Select [0, !Cidr [!Select [0, !GetAtt CruddurVPC.Ipv6CidrBlocks], 256, 64]]
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: cruddur-public-subnet-1
        - Key: Environment  
          Value: production
  
  CruddurPublicSubnet2:
    Type: AWS::EC2::Subnet
    DependsOn: Crudduripv6CidrBlock
    Properties:
      VpcId: !Ref CruddurVPC
      CidrBlock: 10.10.16.0/20
      AssignIpv6AddressOnCreation: true
      Ipv6CidrBlock: !Select [1, !Cidr [!Select [0, !GetAtt CruddurVPC.Ipv6CidrBlocks], 256, 64]]
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: cruddur-public-subnet-2
        - Key: Environment
          Value: production

  CruddurPrivateSubnet1:
    Type: AWS::EC2::Subnet
    DependsOn: Crudduripv6CidrBlock
    Properties:
      VpcId: !Ref CruddurVPC
      CidrBlock: 10.10.32.0/20
      AssignIpv6AddressOnCreation: true
      Ipv6CidrBlock: !Select [2, !Cidr [!Select [0, !GetAtt CruddurVPC.Ipv6CidrBlocks], 256, 64]]
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - Key: Name 
          Value: cruddur-private-subnet-1
        - Key: Environment
          Value: production

  CruddurPrivateSubnet2:
    Type: AWS::EC2::Subnet
    DependsOn: Crudduripv6CidrBlock
    Properties:
      VpcId: !Ref CruddurVPC
      CidrBlock: 10.10.48.0/20
      AssignIpv6AddressOnCreation: true
      Ipv6CidrBlock: !Select [3, !Cidr [!Select [0, !GetAtt CruddurVPC.Ipv6CidrBlocks], 256, 64]]
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [ 1, !GetAZs '' ]

      Tags:
        - Key: Name 
          Value: cruddur-private-subnet-2
        - Key: Environment
          Value: production


# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-routetable.html
  CruddurPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CruddurVPC
      Tags:
        - Key: Name
          Value: cruddur-public-route-table
        - Key: Environment
          Value: production

  CruddurPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CruddurVPC
      Tags:
        - Key: Name
          Value: cruddur-private-route-table
        - Key: Environment
          Value: production

# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-route.html
  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref CruddurPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref CruddurInternetGateway

  PublicIPv6Route:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref CruddurPublicRouteTable
      DestinationIpv6CidrBlock: ::/0
      GatewayId: !Ref CruddurInternetGateway


# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-subnetroutetableassociation.html
  CruddurPublicRouteAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref CruddurPublicRouteTable
      SubnetId: !Ref CruddurPublicSubnet1

  CruddurPublicRouteAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref CruddurPublicRouteTable
      SubnetId: !Ref CruddurPublicSubnet2


  CruddurPrivateRouteAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref CruddurPrivateRouteTable
      SubnetId: !Ref CruddurPrivateSubnet1 
      #VpcId: !Ref CruddurVPC

  CruddurPrivateRouteAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref CruddurPrivateRouteTable
      SubnetId: !Ref CruddurPrivateSubnet2 


# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ec2-securitygroupingress.html
  # ============================================================
  # ALB SECURITY GROUP
  # ============================================================

  CruddurALBSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Cruddur Application Load Balancer
      VpcId: !Ref CruddurVPC
      Tags:
        - Key: Name
          Value: cruddur-alb-sg
        - Key: Environment
          Value: production

  # ------------------------------------------------------------
  # ALB INGRESS - HTTP
  # ------------------------------------------------------------

  CruddurALBHttpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      CidrIp: 0.0.0.0/0
      Description: Allow HTTP from internet
      FromPort: 80
      GroupId: !Ref CruddurALBSg
      IpProtocol: tcp
      ToPort: 80

  # ------------------------------------------------------------
  # ALB INGRESS - HTTPS
  # ------------------------------------------------------------

  CruddurALBHttpsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      CidrIp: 0.0.0.0/0
      Description: Allow HTTPS from internet
      FromPort: 443
      GroupId: !Ref CruddurALBSg
      IpProtocol: tcp
      ToPort: 443

  # ------------------------------------------------------------
  # ALB EGRESS → BACKEND ECS :4567
  # ------------------------------------------------------------

  CruddurALBEcsBackendEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      Description: Allow ALB to reach backend ECS tasks
      DestinationSecurityGroupId: !Ref CruddurEcsSg
      FromPort: 4567
      GroupId: !Ref CruddurALBSg
      IpProtocol: tcp
      ToPort: 4567

  # ------------------------------------------------------------
  # ALB EGRESS → FRONTEND ECS :3000
  # ------------------------------------------------------------

  CruddurALBEcsFrontendEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      Description: Allow ALB to reach frontend ECS tasks
      DestinationSecurityGroupId: !Ref CruddurEcsSg
      FromPort: 3000
      GroupId: !Ref CruddurALBSg
      IpProtocol: tcp
      ToPort: 3000


  # ============================================================
  # ECS SECURITY GROUP
  # ============================================================

  CruddurEcsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Cruddur ECS Fargate
      VpcId: !Ref CruddurVPC
      Tags:
        - Key: Name
          Value: cruddur-ecs-sg
        - Key: Environment
          Value: production

  # ------------------------------------------------------------
  # ECS INGRESS ← ALB :4567
  # ------------------------------------------------------------

  CruddurEcsBackendIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow backend traffic from ALB
      SourceSecurityGroupId: !Ref CruddurALBSg
      FromPort: 4567
      GroupId: !Ref CruddurEcsSg
      IpProtocol: tcp
      ToPort: 4567

  # ------------------------------------------------------------
  # ECS INGRESS ← ALB :3000
  # ------------------------------------------------------------

  CruddurEcsFrontendIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow frontend traffic from ALB
      SourceSecurityGroupId: !Ref CruddurALBSg
      FromPort: 3000
      GroupId: !Ref CruddurEcsSg
      IpProtocol: tcp
      ToPort: 3000


# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-elasticloadbalancingv2-loadbalancer.html

  CruddurALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      #EnablePrefixForIpv6SourceNat: on
      IpAddressType: dualstack
#      LoadBalancerAttributes:
      #ListenerAttributes: 
      #   - Key: routing.http.response.server.enabled
      #     Value: "false"

#        - Key: routing.http.response.strict_transport_security.header_value
#          Value: "max-age=31536000; includeSubDomains"

      #   - Key: routing.http.response.x_content_type_options.header_value
      #     Value: nosniff

      #   - Key: routing.http.response.x_frame_options.header_value
      #     Value: DENY

# Capacity is available ahead of demand, such as predictable high-traffic applications
      # MinimumLoadBalancerCapacity: 
      #   CapacityUnits: 10
      Name: CruddurALB
      Scheme: internet-facing
      SecurityGroups: 
        - !Ref CruddurALBSg
      Subnets: 
        - !Ref CruddurPublicSubnet1
        - !Ref CruddurPublicSubnet2
      Tags: 
        - Key: Environment
          Value: Production
      Type: application

# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-elasticloadbalancingv2-listener.html
  CruddurHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      # AlpnPolicy: 
      #   - crudduralb
    #  Certificates:   # ONLY NEEDED BY HTTPS
      DefaultActions: 
# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-elasticloadbalancingv2-listener-redirectconfig.html
      - Type: "redirect"
        RedirectConfig:
          Port: 443
          StatusCode: "HTTP_301"
          Protocol: "HTTP"
      # ListenerAttributes: 
      #   # Remove the Server header from ALB responses
      #   - Key: routing.http.response.server.enabled
      #     Value: "false"

      #   # HSTS
      #   - Key: routing.http.response.strict_transport_security.header_value
      #     Value: "max-age=31536000; includeSubDomains"

      #   # CORS
      #   - Key: routing.http.response.access_control_allow_origin.header_value
      #     Value: "*"

      #   - Key: routing.http.response.access_control_allow_methods.header_value
      #     Value: "GET,POST,PUT,PATCH,DELETE,OPTIONS"

      #   - Key: routing.http.response.access_control_allow_headers.header_value
      #     Value: "Content-Type,Authorization"

      #   - Key: routing.http.response.access_control_allow_credentials.header_value
      #     Value: "false"

      #   - Key: routing.http.response.access_control_expose_headers.header_value
      #     Value: "Content-Length,Content-Type"

      #   - Key: routing.http.response.access_control_max_age.header_value
      #     Value: "86400"

      #   # Content Security Policy
      #   - Key: routing.http.response.content_security_policy.header_value
      #     Value: "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"

      #   # Prevent MIME-type sniffing
      #   - Key: routing.http.response.x_content_type_options.header_value
      #     Value: "nosniff"

      #   # Prevent clickjacking
      #   - Key: routing.http.response.x_frame_options.header_value
      #     Value: "DENY"

      LoadBalancerArn: !Ref CruddurALB
      # MutualAuthentication: 
      #   MutualAuthentication
      Port: 80
      Protocol: HTTP
# https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html
#      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09   # ONLY NEEDED BY HTTPS
      Tags: 
        - Key: Environment
          Value: Production

  CruddurHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Certificates: 
        - CertificateArn: !Ref AcmCertificateArn
      DefaultActions: 
# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-elasticloadbalancingv2-listener-redirectconfig.html
        - Type: "forward"
          TargetGroupArn: !Ref CruddurFrontendTG
      # ListenerAttributes: 
      #   # Remove the Server header from ALB responses
      #   - Key: routing.http.response.server.enabled
      #     Value: "false"

      #   # HSTS
      #   - Key: routing.http.response.strict_transport_security.header_value
      #     Value: "max-age=31536000; includeSubDomains"

      #   # CORS
      #   - Key: routing.http.response.access_control_allow_origin.header_value
      #     Value: "*"

      #   - Key: routing.http.response.access_control_allow_methods.header_value
      #     Value: "GET,POST,PUT,PATCH,DELETE,OPTIONS"

      #   - Key: routing.http.response.access_control_allow_headers.header_value
      #     Value: "Content-Type,Authorization"

      #   - Key: routing.http.response.access_control_allow_credentials.header_value
      #     Value: "false"

      #   - Key: routing.http.response.access_control_expose_headers.header_value
      #     Value: "Content-Length,Content-Type"

      #   - Key: routing.http.response.access_control_max_age.header_value
      #     Value: "86400"

      #   # Content Security Policy
      #   - Key: routing.http.response.content_security_policy.header_value
      #     Value: "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"

      #   # Prevent MIME-type sniffing
      #   - Key: routing.http.response.x_content_type_options.header_value
      #     Value: "nosniff"

      #   # Prevent clickjacking
      #   - Key: routing.http.response.x_frame_options.header_value
      #     Value: "DENY"

      LoadBalancerArn: !Ref CruddurALB
      # MutualAuthentication: 
      #   MutualAuthentication
      Port: 443
      Protocol: HTTPS
# https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09
      Tags: 
        - Key: Environment
          Value: Production

# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-elasticloadbalancingv2-listenerrule.html
  CruddurBackendRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Priority: 10
      Actions: 
        - Type: forward
          TargetGroupArn: !Ref CruddurBackendTG
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - api.mustaphaops.online        # HostHeaderConfig: 
        #   HostHeaderConfig
        # HttpHeaderConfig: 
        #   HttpHeaderConfig
      ListenerArn: !Ref CruddurHttpsListener
      Tags: 
        - Key: Environment
          Value: Production
      # Transforms: 
      #   - Transform




# https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-elasticloadbalancingv2-targetgroup.html
  CruddurFrontendTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:

#      HealthCheckEnabled: Boolean  # NOT NEEDED, IF TARGETTYPE IS ALB. IT'S ENABLED BY DEFAULT
#      HealthCheckIntervalSeconds: Integer # Default is 30s, SO NOT NEEDED
      HealthCheckPath: /
#      HealthCheckPort: String # DEFAULT WILL BE SET WITH THE TRAFFIC PORT
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
#      HealthyThresholdCount: 5 # Default is 5 already
#      IpAddressType: String
      Matcher: 
        HttpCode: 200
      Name: cruddur-frontend-tg
      Port: 3000
      Protocol: HTTP
      ProtocolVersion: HTTP1
      Tags: 
        - Key: Environment
          Value: Production
#      TargetControlPort: Integer
      TargetGroupAttributes: 
        - Key: deregistration_delay.timeout_seconds
          Value: "30" 
#      Targets: 
#        - TargetDescription
      TargetType: ip
      UnhealthyThresholdCount: 2
      VpcId: !Ref CruddurVPC


  CruddurBackendTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
#      HealthCheckEnabled: Boolean  # NOT NEEDED, IF TARGETTYPE IS ALB. IT'S ENABLED BY DEFAULT
#      HealthCheckIntervalSeconds: Integer # Default is 30s, SO NOT NEEDED
      HealthCheckPath: /api/health-check
#      HealthCheckPort: String # DEFAULT WILL BE SET WITH THE TRAFFIC PORT
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
#      HealthyThresholdCount: 5 # Default is 5 already
#      IpAddressType: String
      Matcher: 
        HttpCode: 200
      Name: cruddur-backend-tg
      Port: 4567
      Protocol: HTTP
      ProtocolVersion: HTTP1
      Tags: 
        - Key: Environment
          Value: Production
#      TargetControlPort: Integer
      TargetGroupAttributes: 
        - Key: deregistration_delay.timeout_seconds
          Value: "30" 
#      Targets: 
#        - TargetDescription
      TargetType: ip
      UnhealthyThresholdCount: 2
      VpcId: !Ref CruddurVPC


  # ============================================================
  # ALB SECURITY GROUP
  # ============================================================


  CruddurRdsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL from ECS
      VpcId: !Ref CruddurVPC

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref CruddurEcsSg
Outputs:

  VpcId:
    Description: Cruddur VPC ID
    Value: !Ref CruddurVPC
    Export:
      Name: CruddurVPC

  PublicSubnetA:
    Description: Cruddur Public Subnet A ID
    Value: !Ref CruddurPublicSubnet1
    Export:
      Name: CruddurPublicSubnet1

  PublicSubnetB:
    Description: Cruddur Public Subnet B ID
    Value: !Ref CruddurPublicSubnet2
    Export:
      Name: CruddurPublicSubnet2

  PrivateSubnetA:
    Description: Cruddur Private Subnet A ID
    Value: !Ref CruddurPrivateSubnet1
    Export:
      Name: CruddurPrivateSubnet1

  PrivateSubnetB:
    Description: Cruddur Private Subnet B ID
    Value: !Ref CruddurPrivateSubnet2
    Export:
      Name: CruddurPrivateSubnet2

  # LoadBalancerArn:
  #   Description: Cruddur ALB ARN
  #   Value: !GetAtt CruddurALB.LoadBalancerArn
  #   Export:
  #     Name: CruddurALB

  BackendTargetGroupArn:
    Description: Cruddur Backend Target Group ARN
    Value: !Ref CruddurBackendTG
    Export:
      Name: CruddurBackendTG

  FrontendTargetGroupArn:
    Description: Cruddur Frontend Target Group ARN
    Value: !Ref CruddurFrontendTG
    Export:
      Name: CruddurFrontendTG

  CruddurEcsSg:
    Description: Cruddur ECS Security Group
    Value: !Ref CruddurEcsSg
    Export:
      Name: CruddurEcsSg

  CruddurRdsSg:
    Description: Cruddur ECS Security Group
    Value: !Ref CruddurRdsSg
    Export:
      Name: CruddurRdsSg



